# coderkrow — Ghostty theme (light)
# Light counterpart of `coderkrow`.
# Palette: #f5f4f0 / #1d1d1b / #1a595a / #c3dede
# Rules:   .ai/rules/brand/RULES.md

font-family = IoskeleyMono Nerd Font

background = #f5f4f0
foreground = #1d1d1b

cursor-color = #1a595a
cursor-text = #f5f4f0

# Teal tint instead of the dark variant's solid teal fill: on a light
# ground the selection reads as a wash of brand teal at ~20%.
selection-background = #c3dede
selection-foreground = #1d1d1b

# ANSI 16-color palette
# Same hues as the dark variant, moved to the light-ground legible step.
# Signal cyan #00d1d4 is 1.72:1 on #f5f4f0 — fills and glows only, never
# palette text.
palette = 0=#1d1d1b
palette = 1=#b23b34
palette = 2=#1f7a56
palette = 3=#876419
palette = 4=#1f6b8f
palette = 5=#a04a6e
palette = 6=#2b7677
palette = 7=#38352f

palette = 8=#4a4a47
palette = 9=#952f28
palette = 10=#17744d
palette = 11=#7d5e19
palette = 12=#17536f
palette = 13=#7d3552
palette = 14=#1a595a
palette = 15=#1d1d1b

# Keep extended ANSI colors coherent with base palette.
palette-generate = true
